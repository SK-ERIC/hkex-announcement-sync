services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+asyncmy://hkex:hkex_secret@db:3306/hkex_sync
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data/pdfs
      - SYNC_STOCK_CODES=00700,09988
    volumes:
      - pdf_data:/app/data/pdfs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    environment:
      - DATABASE_URL=mysql+asyncmy://hkex:hkex_secret@db:3306/hkex_sync
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data/pdfs
      - SYNC_STOCK_CODES=00700,09988
    volumes:
      - pdf_data:/app/data/pdfs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info

  beat:
    build: .
    environment:
      - DATABASE_URL=mysql+asyncmy://hkex:hkex_secret@db:3306/hkex_sync
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data/pdfs
      - SYNC_STOCK_CODES=00700,09988
    volumes:
      - pdf_data:/app/data/pdfs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: hkex_sync
      MYSQL_USER: hkex
      MYSQL_PASSWORD: hkex_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  pdf_data:

