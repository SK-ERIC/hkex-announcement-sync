# Standalone mode — SQLite + single process, no Redis/Celery/MySQL needed.
# Usage: docker compose -f docker-compose.standalone.yml up -d
#
# Sync tasks run in-process (no background worker).
# Data is stored in the ./data directory (SQLite DB + PDF files).

services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/hkex_sync.db
      - CELERY_ENABLED=false
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/app/data/pdfs
      - SYNC_STOCK_CODES=${SYNC_STOCK_CODES:-00700,09988}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - NOTIFIER_ENABLED=${NOTIFIER_ENABLED:-false}
      - NOTIFIER_TYPE=${NOTIFIER_TYPE:-}
      - NOTIFIER_FEISHU_WEBHOOK=${NOTIFIER_FEISHU_WEBHOOK:-}
      - NOTIFIER_FEISHU_SECRET=${NOTIFIER_FEISHU_SECRET:-}
      - NOTIFIER_ON_SYNC=${NOTIFIER_ON_SYNC:-true}
      - NOTIFIER_ON_NEW=${NOTIFIER_ON_NEW:-true}
      - SITE_URL=${SITE_URL:-http://localhost:8000}
    volumes:
      - app_data:/app/data

volumes:
  app_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
